<svg xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="720"
  viewBox="0 0 1000 720">

  <defs>

    <linearGradient id="terminal-bg"
      x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="14"
        flood-color="#000000"
        flood-opacity="0.45"/>
    </filter>

    <style>
      .terminal {
        font-family:
          "Fira Code",
          "JetBrains Mono",
          "SFMono-Regular",
          Consolas,
          monospace;
      }

      .command {
        fill: #58a6ff;
        font-weight: 600;
      }

      .output {
        fill: #c9d1d9;
      }

      .title {
        fill: #f0f6fc;
        font-weight: 700;
      }

      .muted {
        fill: #8b949e;
      }

      .cursor {
        fill: #58a6ff;
      }

      .line {
        opacity: 0;
        animation: showLine 0.35s ease forwards;
      }

      @keyframes showLine {
        from {
          opacity: 0;
          transform: translateX(-8px);
        }

        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .blink {
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </defs>

  <rect
    x="20"
    y="20"
    width="960"
    height="680"
    rx="18"
    fill="url(#terminal-bg)"
    filter="url(#shadow)"
  />

  <rect
    x="20"
    y="20"
    width="960"
    height="58"
    rx="18"
    fill="#21262d"
  />

  <circle cx="55" cy="49" r="8" fill="#ff5f56"/>
  <circle cx="80" cy="49" r="8" fill="#ffbd2e"/>
  <circle cx="105" cy="49" r="8" fill="#27c93f"/>

