name: Update Terminal Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get GitHub Statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/eudionelima \
            > /tmp/user.json

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/eudionelima/repos?per_page=100" \
            > /tmp/repos.json

      - name: Generate Animated Terminal SVG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'PY'
          import json
          import html
          from pathlib import Path

          user = json.load(open("/tmp/user.json"))
          repos = json.load(open("/tmp/repos.json"))

          username = "eudionelima"

          name = user.get("name") or username
          bio = user.get("bio") or "Cybersecurity enthusiast"
          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)

          total_stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repos
              if isinstance(repo, dict)
          )

          total_forks = sum(
              repo.get("forks_count", 0)
              for repo in repos
              if isinstance(repo, dict)
          )

          languages = {}

          for repo in repos:
              if not isinstance(repo, dict):
                  continue

              language = repo.get("language")

              if language:
                  languages[language] = languages.get(language, 0) + 1

          top_languages = sorted(
              languages.items(),
              key=lambda item: item[1],
              reverse=True
          )[:5]

          language_text = ", ".join(
              language for language, _ in top_languages
          )

          if not language_text:
              language_text = "HTML, CSS, JavaScript"

          name = html.escape(str(name))
          bio = html.escape(str(bio))
          language_text = html.escape(language_text)

          lines = [
              ("command", "$ whoami"),
              ("output", f"{name}"),
              ("command", "$ neofetch"),
              ("output", "╭──────────────────────────────────────╮"),
              ("output", f"│  USER        {username:<24}│"),
              ("output", "│  ROLE        Cybersecurity            │"),
              ("output", "│  LOCATION    São Paulo, Brazil        │"),
              ("output", "│  STATUS      Online                   │"),
              ("output", "╰──────────────────────────────────────╯"),
              ("command", "$ github --stats"),
              ("output", f"Repositories : {public_repos}"),
              ("output", f"Followers    : {followers}"),
              ("output", f"Following    : {following}"),
              ("output", f"Stars        : {total_stars}"),
              ("output", f"Forks        : {total_forks}"),
              ("command", "$ languages"),
              ("output", language_text),
              ("command", "$ about"),
              ("output", bio),
              ("command", "$ uptime"),
              ("output", "Always learning. Always improving."),
              ("command", "$ exit"),
          ]

          width = 1000
          height = 720

          svg_lines = []

          svg_lines.append(f'''<svg xmlns="http://www.w3.org/2000/svg"
            width="{width}"
            height="{height}"
            viewBox="0 0 {width} {height}">

            <defs>

              <linearGradient id="terminal-bg"
                x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0d1117"/>
                <stop offset="100%" stop-color="#161b22"/>
              </linearGradient>

              <filter id="shadow">
                <feDropShadow
                  dx="0"
                  dy="8"
                  stdDeviation="14"
                  flood-color="#000000"
                  flood-opacity="0.45"/>
              </filter>

              <style>
                .terminal {{
                  font-family:
                    "Fira Code",
                    "JetBrains Mono",
                    "SFMono-Regular",
                    Consolas,
                    monospace;
                }}

                .command {{
                  fill: #58a6ff;
                  font-weight: 600;
                }}

                .output {{
                  fill: #c9d1d9;
                }}

                .title {{
                  fill: #f0f6fc;
                  font-weight: 700;
                }}

                .muted {{
                  fill: #8b949e;
                }}

                .cursor {{
                  fill: #58a6ff;
                }}

                .line {{
                  opacity: 0;
                  animation: showLine 0.35s ease forwards;
                }}

                @keyframes showLine {{
                  from {{
                    opacity: 0;
                    transform: translateX(-8px);
                  }}

                  to {{
                    opacity: 1;
                    transform: translateX(0);
                  }}
                }}

                .blink {{
                  animation: blink 1s step-end infinite;
                }}

                @keyframes blink {{
                  50% {{
                    opacity: 0;
                  }}
                }}
              </style>
            </defs>

            <rect
              x="20"
              y="20"
              width="960"
              height="680"
              rx="18"
              fill="url(#terminal-bg)"
              filter="url(#shadow)"
            />

            <rect
              x="20"
              y="20"
              width="960"
              height="58"
              rx="18"
              fill="#21262d"
            />

            <circle cx="55" cy="49" r="8" fill="#ff5f56"/>
            <circle cx="80" cy="49" r="8" fill="#ffbd2e"/>
            <circle cx="105" cy="49" r="8" fill="#27c93f"/>

            <text
              x="500"
              y="54"
              text-anchor="middle"
              class="terminal muted"
              font-size="16">
              {username}@github — terminal
            </text>

            <text
              x="52"
              y="112"
              class="terminal title"
              font-size="18">
              GitHub Stats Terminal
            </text>
          ''')

          start_y = 145
          line_height = 25

          for index, (kind, text) in enumerate(lines):
              y = start_y + index * line_height
              delay = 0.35 + index * 0.22

              class_name = "command" if kind == "command" else "output"

              svg_lines.append(
                  f'''
                  <text
                    x="52"
                    y="{y}"
                    class="terminal {class_name} line"
                    font-size="16"
                    style="animation-delay:{delay:.2f}s">
                    {text}
                  </text>
                  '''
              )

          cursor_y = start_y + len(lines) * line_height + 3

          svg_lines.append(
              f'''
              <rect
                x="52"
                y="{cursor_y - 17}"
                width="9"
                height="19"
                class="cursor blink"
              />

              <text
                x="72"
                y="{cursor_y}"
                class="terminal muted"
                font-size="14">
                last update: GitHub Actions
              </text>

              </svg>
              '''
          )

          output = "\n".join(svg_lines)

          Path("assets/github_stats.svg").write_text(
              output,
              encoding="utf-8"
          )

          print("Animated terminal generated successfully.")
          PY

      - name: Commit Updated Terminal
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/github_stats.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub terminal stats [skip ci]"
            git push
          fi
